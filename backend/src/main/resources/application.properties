spring.application.name=gymflow-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gymflow}
spring.datasource.username=${DB_USER:gymflow}
spring.datasource.password=${DB_PASSWORD:gymflow}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true

# Secreto HS256 (>= 32 bytes). Obligatorio fuera de desarrollo.
gymflow.security.jwt-secret=${JWT_SECRET:}
gymflow.security.jwt-ttl-minutes=${JWT_TTL_MINUTES:480}
gymflow.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
# Crea usuarios/datos de demostración al arrancar con el perfil "demo"
gymflow.demo.admin-password=${DEMO_PASSWORD:Admin123!}

management.endpoints.web.exposure.include=health
